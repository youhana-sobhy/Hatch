[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hatch-ztp-service"
version = "0.1.0"
description = "Hatch ZTP edge service: Day-0 bootstraps, call-home relay and image server."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Youhana Sobhy" }]
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["ztp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
