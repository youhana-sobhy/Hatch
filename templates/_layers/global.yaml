# Layer 1 of 5: the global baseline. Every setting lives in exactly one layer:
#   global -> market -> site -> role -> device
naming:
  hostname_regex: '^[a-z]{3}-[a-z0-9]+-[a-z0-9-]+-\d{2}$'

domain_name: net.example.internal
timezone: UTC
banner: |
  This system is for the use of authorised users only. All activity is logged
  and monitored. Disconnect now if you are not an authorised user.

dns_servers: [10.255.0.53, 10.255.1.53]
ntp_servers: [10.255.0.123, 10.255.1.123]
syslog_servers: [10.255.0.51]

aaa:
  tacacs_servers: [10.255.0.49, 10.255.1.49]
  local_fallback_user: hatch-breakglass

snmp:
  v3_user: hatch-monitor
  contact: noc@example.internal

# Networks allowed to reach device management planes.
mgmt_acl:
  - 10.255.0.0/16
  - 10.200.0.0/14
