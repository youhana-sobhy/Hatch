{{- if .Values.ui.enabled }}
{{- $name := "ui" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hatch.fullname" . }}-{{ $name }}
  labels:
    {{- include "hatch.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ .Values.ui.replicas }}
  selector:
    matchLabels:
      {{- include "hatch.selector" (dict "root" . "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hatch.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: {{ include "hatch.image" (dict "root" . "name" $name) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HATCH_API_UPSTREAM
              value: http://{{ include "hatch.fullname" . }}-orchestrator:8000
          readinessProbe:
            httpGet: {path: /, port: http}
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "hatch.fullname" . }}-{{ $name }}
  labels:
    {{- include "hatch.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "hatch.selector" (dict "root" . "name" $name) | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
